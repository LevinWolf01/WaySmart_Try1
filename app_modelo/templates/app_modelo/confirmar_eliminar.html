{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Modelo</title>
    <link rel="stylesheet" href="{% static 'app_modelo/estilos.css' %}">
</head>
<body>
<div class="contenedor-alerta">
    <h1>¿Estás seguro?</h1>
    <p>Vas a eliminar el modelo con ID: <strong>{{ modelo.idModelo }}</strong>. Esta acción no se puede deshacer.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn-eliminar-confirmar">Sí, eliminar</button>
        <a href="{% url 'lista_modelos' %}" class="btn-cancelar">Cancelar</a>
    </form>
</div>
</body>
</html>
