{% load static %}
<!DOCTYPE html>
<html lang="ES-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar destino</title>
    <link rel="stylesheet" href="{% static 'app_destinos_servicios/destinos.css' %}">
</head>
<body>
    <form class="destino-form" method="post" action="{% url 'app_destinos_servicios:crear_destino' %}">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <h2>Registro de Destino</h2>

  <div class="form-grid">
    <!-- Relaciones (Claves Foráneas) -->
    <div class="form-group">
      <label for="id_pago_entrega">ID Pago Entrega</label>
      <input type="number" id="id_pago_entrega" name="id_pago_entrega" placeholder="Ej. 101">
    </div>

    <div class="form-group">
      <label for="servicio_id">ID Servicio</label>
      <input type="number" id="servicio_id" name="servicio_id" placeholder="Ej. 25">
    </div>

    <div class="form-group">
      <label for="asignacion_id">ID Asignación</label>
      <input type="number" id="asignacion_id" name="asignacion_id" placeholder="Ej. 8">
    </div>

    <!-- Datos del Destinatario -->
    <div class="form-group">
      <label for="nombre_destinatario">Nombre Destinatario</label>
      <input type="text" id="nombre_destinatario" name="nombre_destinatario" required>
    </div>

    <div class="form-group">
      <label for="telefono_destinatario">Teléfono Destinatario</label>
      <input type="tel" id="telefono_destinatario" name="telefono_destinatario">
    </div>

    <!-- Ubicación -->
    <div class="form-group full-width">
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" required placeholder="Calle, Carrera, Av...">
    </div>

    <div class="form-group">
      <label for="latitud">Latitud</label>
      <input type="number" step="any" id="latitud" name="latitud" placeholder="Ej. 4.5981">
    </div>

    <div class="form-group">
      <label for="longitud">Longitud</label>
      <input type="number" step="any" id="longitud" name="longitud" placeholder="Ej. -74.0760">
    </div>

    <!-- Enumeraciones y Estado -->
    <div class="form-group">
      <label for="prioridad">Prioridad</label>
      <select id="prioridad" name="prioridad">
        <option value="Baja">Baja</option>
        <option value="Media" selected>Media</option>
        <option value="Alta">Alta</option>
      </select>
    </div>

    <div class="form-group">
      <label for="estado_entrega">Estado de Entrega</label>
      <select id="estado_entrega" name="estado_entrega">
        <option value="Pendiente">Pendiente</option>
        <option value="En Ruta">En Ruta</option>
        <option value="Entregado">Entregado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>

    <!-- Fecha y Firma -->
    <div class="form-group">
      <label for="fecha_entrega">Fecha de Entrega</label>
      <input type="datetime-local" id="fecha_entrega" name="fecha_entrega">
    </div>

    <div class="form-group">
      <label for="firma_digital_url">URL Firma Digital</label>
      <input type="url" id="firma_digital_url" name="firma_digital_url" placeholder="https://...">
    </div>

    <!-- Observaciones -->
    <div class="form-group full-width">
      <label for="observaciones">Observaciones</label>
      <textarea id="observaciones" name="observaciones" rows="3" placeholder="Detalles adicionales del envío..."></textarea>
    </div>
  </div>

  <button type="submit" class="btn-submit">Guardar Destino</button>
  <a href="{% url 'app_destinos_servicios:lista_destinos' %}">Ver destinos guardados</a>
</form>
</body>
</html>
